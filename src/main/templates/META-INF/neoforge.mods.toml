modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
# Hard requirements: only MineColonies and Structurize. Everything else is optional so the
# mod loads in any 1.21.1 pack; the "Modern City" pack activates when Create, AE2 and
# Create Crafts & Additions are present, "Modern City Lite" always works.
[[dependencies.${mod_id}]]
    modId="minecolonies"
    type="required"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="structurize"
    type="required"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="create"
    type="optional"
    versionRange="[6.0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="ae2"
    type="optional"
    versionRange="[19.0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="createaddition"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
# Optional: used by the Modern City Complete pack.
